[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragbench-kr"
version = "0.1.0"
description = "A reproducible Korean long-document RAG benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires an explicitly enabled live provider call",
  "integration: exercises external service integration",
  "gold: accesses the sealed gold benchmark split",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ragbench"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]
