[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragbench-kr"
version = "0.1.0"
description = "A reproducible Korean long-document RAG benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.3,<1",
  "pypdf>=5,<6",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "typer>=0.15,<1",
  "tiktoken>=0.11,<0.12",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires an explicitly enabled live provider call",
  "integration: exercises external service integration",
  "gold: accesses the sealed gold benchmark split",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ragbench"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]
